{{- if .Values.httpRoute.enabled -}}
  {{- $fullName := include "lakefs.fullname" . -}}
  {{- $svcPort := .Values.service.port -}}
  {{- if not .Values.httpRoute.parentRefs -}}
    {{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true" -}}
  {{- end -}}
  {{- $hostnames := .Values.httpRoute.hostnames -}}
  {{- if not $hostnames -}}
    {{- $hostnames = list -}}
    {{- range .Values.ingress.hosts -}}
      {{- if .host -}}
        {{- $hostnames = append $hostnames .host -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- $pathsOverrides := .Values.httpRoute.pathsOverrides -}}
  {{- if not $pathsOverrides -}}
    {{- $pathsOverrides = list -}}
    {{- range .Values.ingress.hosts -}}
      {{- range .pathsOverrides -}}
        {{- $pathsOverrides = append $pathsOverrides . -}}
      {{- end -}}
    {{- end -}}
    {{- $pathsOverrides = uniq $pathsOverrides -}}
  {{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "lakefs.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with $hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $pathsOverrides }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ .serviceName }}
          port: {{ .servicePort }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
{{- end }}
