{{- if .Values.httpRoute.enabled -}}
  {{- $fullName := include "lakefs.fullname" . -}}
  {{- $svcPort := .Values.service.port -}}
  {{- if not .Values.httpRoute.parentRefs -}}
    {{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true" -}}
  {{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "lakefs.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- $redirect := false }}
    {{- range .filters }}
    {{- if eq .type "RequestRedirect" }}{{- $redirect = true }}{{- end }}
    {{- end }}
    {{- $rule := pick . "matches" "filters" "timeouts" "backendRefs" }}
    {{- if and (not .backendRefs) (not $redirect) }}
    {{- $_ := set $rule "backendRefs" (list (dict "name" $fullName "port" $svcPort)) }}
    {{- end }}
    - {{ toYaml $rule | indent 6 | trim }}
    {{- end }}
{{- end }}
