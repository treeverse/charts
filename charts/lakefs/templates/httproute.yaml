{{/* Gateway API route, the kgateway equivalent of ingress.yaml. sectionName mandatory, else it binds http-80 too. */}}
{{- if .Values.kgateway.enabled }}
{{- $fullName := include "lakefs.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "lakefs.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "kgateway.gatewayName is required" .Values.kgateway.gatewayName }}
      namespace: {{ .Values.kgateway.gatewayNamespace }}
      sectionName: {{ .Values.kgateway.sectionName }}
  hostnames:
    {{- if .Values.kgateway.hostnames }}
    {{- range .Values.kgateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- else }}
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
    {{- end }}
  rules:
    {{- if .Values.kgateway.denyInternalPaths }}
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
        - path:
            type: PathPrefix
            value: /_pprof
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.kgateway.dev
            kind: DirectResponse
            name: {{ $fullName }}-deny-internal-paths
    {{- end }}
    {{- range .Values.ingress.hosts }}
    {{- range .pathsOverrides }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ .serviceName }}
          port: {{ .servicePort }}
    {{- end }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
{{- end }}
