{{- if .Values.httpRoute.enabled -}}
  {{- $fullName := include "lakefs.fullname" . -}}
  {{- $svcPort := .Values.service.port -}}
  {{- if not .Values.httpRoute.parentRefs -}}
    {{- fail "httpRoute.parentRefs is required when httpRoute.enabled is true" -}}
  {{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "lakefs.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.pathsOverrides }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ .serviceName }}
          port: {{ .servicePort }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
{{- end }}
