{{- if .Values.autoscaling.enabled -}}
  {{- $a := .Values.autoscaling -}}
  {{- if not (or $a.targetCPUUtilizationPercentage $a.targetMemoryUtilizationPercentage $a.metrics) -}}
    {{- fail "autoscaling.enabled requires targetCPUUtilizationPercentage, targetMemoryUtilizationPercentage or metrics" -}}
  {{- end -}}
  {{- $res := .Values.resources | default dict -}}
  {{- $req := $res.requests | default dict -}}
  {{- $lim := $res.limits | default dict -}}
  {{- if and $a.targetCPUUtilizationPercentage (not (or $req.cpu $lim.cpu)) -}}
    {{- fail "autoscaling.targetCPUUtilizationPercentage requires resources.requests.cpu (or limits.cpu)" -}}
  {{- end -}}
  {{- if and $a.targetMemoryUtilizationPercentage (not (or $req.memory $lim.memory)) -}}
    {{- fail "autoscaling.targetMemoryUtilizationPercentage requires resources.requests.memory (or limits.memory)" -}}
  {{- end -}}
  {{- if lt (int $a.maxReplicas) (int $a.minReplicas) -}}
    {{- fail "autoscaling.maxReplicas must be >= autoscaling.minReplicas" -}}
  {{- end -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lakefs.fullname" . }}
  labels:
    {{- include "lakefs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lakefs.fullname" . }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    {{- with $a.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $a.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $a.metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $a.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
