{{/* Route timeouts and retries. Never add transformation: it replaces the gateway's forwarded-header overwrite. */}}
{{- $tp := .Values.kgateway.trafficPolicy }}
{{- if .Values.kgateway.enabled }}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ include "lakefs.fullname" . }}
  labels:
    {{- include "lakefs.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "lakefs.fullname" . }}
  {{- with $tp.timeouts }}
  timeouts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $tp.retry }}
  retry:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
